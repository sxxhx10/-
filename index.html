<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 테트리스 게임 (줄 삭제 점수 및 3배 콤보 적용)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            /* 웹페이지 전체 배경인 기존 todo.png 유지 */
            background: url('todo.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 양옆에서 춤추는 고양이 배경 이미지 */
        .dancing-cat {
            position: absolute;
            width: 130px;
            height: auto;
            opacity: 0.75;
            z-index: 1;
            pointer-events: none;
        }

        .cat-left {
            left: 8%;
            top: 50%;
            animation: danceLeft 1.2s infinite ease-in-out alternate;
        }

        .cat-right {
            right: 8%;
            top: 50%;
            animation: danceRight 1.2s infinite ease-in-out alternate;
        }

        @keyframes danceLeft {
            0% {
                transform: translateY(-50%) rotate(0deg) scale(1);
            }
            50% {
                transform: translateY(calc(-50% - 25px)) rotate(-8deg) scale(1.04);
            }
            100% {
                transform: translateY(calc(-50% + 15px)) rotate(8deg) scale(0.96);
            }
        }

        @keyframes danceRight {
            0% {
                transform: translateY(-50%) rotate(0deg) scale(1);
            }
            50% {
                transform: translateY(calc(-50% + 25px)) rotate(8deg) scale(1.04);
            }
            100% {
                transform: translateY(calc(-50% - 15px)) rotate(-8deg) scale(0.96);
            }
        }

        .container {
            display: flex;
            gap: 15px;
            background: rgba(43, 43, 43, 0.9);
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
        }
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 캔버스 크기 (가로 7칸 * 26px = 182px, 세로 15칸 * 26px = 390px) */
        canvas {
            background: rgba(17, 17, 17, 0.95);
            border: 2px solid #555;
            display: block;
        }
        .side-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 140px;
        }
        .info-box {
            background: rgba(30, 30, 30, 0.9);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #444;
        }
        .info-box h3 {
            margin: 0 0 5px 0;
            font-size: 12px;
            color: #aaa;
        }
        .info-box p {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
            color: #4CAF50;
        }
        #next-canvas {
            background: #111;
            border: 1px solid #444;
            margin: 0 auto;
        }
        .controls {
            font-size: 10px;
            color: #aaa;
            line-height: 1.3;
        }
        .controls span {
            color: #fff;
            font-weight: bold;
        }
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #45a049;
        }

        /* 게임 오버 모달 팝업 스타일 */
        #game-over-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #2b2b2b;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #555;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-content h2 {
            color: #ff5722;
            margin-top: 0;
            font-size: 26px;
        }
        .modal-content p {
            font-size: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- 배경음악 오디오 태그 -->
    <audio id="bgm" src="bgm.mp3" preload="auto" loop></audio>

    <!-- 양옆에서 춤추는 고양이 배경 이미지 -->
    <img src="cat.png" alt="Dancing Cat Left" class="dancing-cat cat-left">
    <img src="cat.png" alt="Dancing Cat Right" class="dancing-cat cat-right">

    <div class="container">
        <!-- 게임 화면 영역 -->
        <div class="game-area" style="width: 100%;">
            <!-- 메인 테트리스 보드 (가로 7칸 x 세로 15칸 / 캔버스: 182x390) -->
            <canvas id="tetris" width="182" height="390"></canvas>
        </div>

        <!-- 사이드 패널 (점수, 다음 블록, 컨트롤 설명) -->
        <div class="side-panel">
            <div>
                <div class="info-box" style="margin-bottom: 8px;">
                    <h3>SCORE</h3>
                    <p id="score">0</p>
                </div>
                <div class="info-box">
                    <h3>NEXT</h3>
                    <canvas id="next-canvas" width="60" height="60"></canvas>
                </div>
            </div>

            <div class="info-box controls" style="text-align: left;">
                <h3>조작법</h3>
                <p>← → : 이동</p>
                <p>↑ : 회전</p>
                <p>↓ : 소프트 드롭</p>
                <p><span>스페이스</span> : 쿵 내리기</p>
                <p style="color: #ffeb3b; margin-top: 4px;"><span>Shift</span> : 블록 교체(1회)</p>
            </div>

            <button class="btn" id="start-btn">게임 시작</button>
        </div>
    </div>

    <!-- 게임 오버 커스텀 팝업 모달 -->
    <div id="game-over-modal">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <p>최종 점수: <span id="final-score" style="color: #4CAF50; font-weight: bold;">0</span>점</p>
            <button class="btn" id="restart-btn" style="width: 100%;">다시 시작하기</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextContext = nextCanvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const startBtn = document.getElementById('start-btn');
        const bgm = document.getElementById('bgm');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreElement = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        // 블록 한 칸 크기를 26px로 확대
        context.scale(26, 26);
        nextContext.scale(15, 15);

        function arenaSweep() {
            let clearedLines = 0;
            
            // 완성된 줄을 찾아 제거
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                clearedLines++;
            }

            if (clearedLines > 0) {
                // 1줄=10, 2줄=20, 3줄=30점 기본 계산
                let basePoints = clearedLines * 10;

                // 연속으로 줄을 없앴다면(콤보 중이라면) 직전 획득 점수의 3배 적용
                if (player.combo > 0) {
                    player.lastEarnedScore = player.lastEarnedScore * 3;
                } else {
                    player.lastEarnedScore = basePoints;
                }

                player.score += player.lastEarnedScore;
                player.combo++; // 콤보 증가
            } else {
                // 이번에 줄을 못 없애고 블록이 쌓였다면 콤보 초기화
                // (단, 블록이 고정되는 시점에 호출되므로 줄이 안 지워졌으면 콤보 리셋)
                player.combo = 0;
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 가로 7칸 x 세로 15칸 보드 생성
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') {
                return [[0, 0, 0], [1, 1, 1], [0, 1, 0]];
            } else if (type === 'O') {
                return [[2, 2], [2, 2]];
            } else if (type === 'L') {
                return [[0, 0, 3], [3, 3, 3], [0, 0, 0]];
            } else if (type === 'J') {
                return [[4, 0, 0], [4, 4, 4], [0, 0, 0]];
            } else if (type === 'I') {
                return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
            } else if (type === 'S') {
                return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            } else if (type === 'Z') {
                return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
            }
        }

        const colors = [
            null,
            '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF',
        ];

        function drawGrid(ctx, width, height) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 0.05;

            for (let x = 0; x < width; x++) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            for (let y = 0; y < height; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        // 둥글고 입체적인 블록 조각 그리기 함수
        function drawShinyBlock(ctx, x, y, color) {
            ctx.save();
            ctx.translate(x, y);

            const radius = 0.2;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(1 - radius, 0);
            ctx.quadraticCurveTo(1, 0, 1, radius);
            ctx.lineTo(1, 1 - radius);
            ctx.quadraticCurveTo(1, 1, 1 - radius, 1);
            ctx.lineTo(radius, 1);
            ctx.quadraticCurveTo(0, 1, 0, 1 - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();

            ctx.fillStyle = color;
            ctx.fill();

            const grad = ctx.createLinearGradient(0, 0, 0, 1);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
            grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.05)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.lineWidth = 0.06;
            ctx.stroke();

            ctx.restore();
        }

        function drawMatrix(matrix, offset, ctx = context) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        drawShinyBlock(ctx, x + offset.x, y + offset.y, colors[value]);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = 'rgba(17, 17, 17, 0.95)';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawGrid(context, 7, 15);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawNext() {
            nextContext.fillStyle = '#111';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            drawGrid(nextContext, 4, 4);

            const matrix = player.nextMatrix;
            const offset = {
                x: (4 - matrix[0].length) / 2,
                y: (4 - matrix.length) / 2
            };
            drawMatrix(matrix, offset, nextContext);
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        // Shift 키 홀드 기능 (블록당 1회)
        function playerHold() {
            if (!player.canHold) return;

            if (player.holdMatrix === null) {
                player.holdMatrix = player.matrix;
                player.matrix = player.nextMatrix;
                const pieces = 'TJLOSZI';
                player.nextMatrix = createPiece(pieces[(pieces.length * Math.random()) | 0]);
                drawNext();
            } else {
                const temp = player.matrix;
                player.matrix = player.holdMatrix;
                player.holdMatrix = temp;
            }

            player.pos.y = 0;
            player.pos.x = ((arena[0].length / 2) | 0) - ((player.matrix[0].length / 2) | 0);
            player.canHold = false;
        }

        function playerReset() {
            if (player.nextMatrix === null) {
                const pieces = 'TJLOSZI';
                player.matrix = createPiece(pieces[(pieces.length * Math.random()) | 0]);
            } else {
                player.matrix = player.nextMatrix;
            }
            
            const pieces = 'TJLOSZI';
            player.nextMatrix = createPiece(pieces[(pieces.length * Math.random()) | 0]);
            drawNext();

            player.pos.y = 0;
            player.pos.x = ((arena[0].length / 2) | 0) - ((player.matrix[0].length / 2) | 0);
            player.canHold = true;

            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                
                isPaused = true;
                bgm.pause();
                bgm.currentTime = 0;

                finalScoreElement.innerText = player.score;
                gameOverModal.style.display = 'flex';
                startBtn.innerText = '게임 시작';
            }
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isPaused = true;

        function update(time = 0) {
            if (isPaused) return;

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function updateScore() {
            scoreElement.innerText = player.score;
        }

        const arena = createMatrix(7, 15);
        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            nextMatrix: null,
            holdMatrix: null,
            canHold: true,
            score: 0,
            combo: 0,
            lastEarnedScore: 0,
        };

        window.addEventListener('keydown', event => {
            if (isPaused) return;

            if (event.key === 'ArrowLeft') playerMove(-1);
            else if (event.key === 'ArrowRight') playerMove(1);
            else if (event.key === 'ArrowDown') playerDrop();
            else if (event.key === 'ArrowUp') playerRotate(1);
            else if (event.key === 'Shift') {
                event.preventDefault();
                playerHold();
            }
            else if (event.code === 'Space') {
                event.preventDefault();
                playerHardDrop();
            }
        });

        function startGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.combo = 0;
            player.lastEarnedScore = 0;
            player.holdMatrix = null;
            player.canHold = true;
            updateScore();
            playerReset();
            gameOverModal.style.display = 'none';
            isPaused = false;
            lastTime = performance.now();
            update();
            
            bgm.currentTime = 0;
            bgm.play().catch(error => {
                console.log("자동 재생 정책 제한:", error);
            });

            startBtn.innerText = '게임 중...';
        }

        startBtn.addEventListener('click', () => {
            if (isPaused && gameOverModal.style.display !== 'flex') {
                startGame();
            }
        });

        restartBtn.addEventListener('click', () => {
            startGame();
        });

        // 초기 화면 그리기
        draw();
    </script>
</body>
</html>
